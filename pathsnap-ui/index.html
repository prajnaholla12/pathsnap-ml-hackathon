<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PathSnap – Evaluator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <aside id="side">
    <header>
      <h1>PathSnap</h1>
      <p class="sub">GPS map-matching – evaluator console</p>
    </header>

    <section class="box">
      <label for="api">API address (Laptop 1)</label>
      <div class="row">
        <input id="api" type="text" spellcheck="false">
        <button id="connect">Connect</button>
      </div>
      <div id="status" class="status off">not connected</div>
    </section>

    <section class="box">
      <h2>Evaluation trips</h2>
      <div id="trips" class="trips"><p class="muted">connect to load trips</p></div>
    </section>

    <section class="box" id="resultBox" hidden>
      <h2>Result <span id="resTrip"></span></h2>
      <div class="kpis">
        <div class="kpi main"><span id="kAcc">–</span><small>Top-1 accuracy (HMM)</small></div>
        <div class="kpi"><span id="kClf">–</span><small>Classifier only</small></div>
        <div class="kpi"><span id="kF1">–</span><small>Macro F1 (HMM)</small></div>
        <div class="kpi"><span id="kCont">–</span><small>Route F1</small></div>
      </div>
      <table id="details"></table>
    </section>

    <section class="box">
      <h2>Request log</h2>
      <ol id="log" class="log"></ol>
    </section>
  </aside>

  <main>
    <div id="map"></div>
    <div id="busy" hidden><div class="spinner"></div><span>running pipeline on the API…</span></div>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
